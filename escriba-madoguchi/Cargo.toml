[package]
name = "escriba-madoguchi"
description = "The service counter (窓口) — the read-only seam authored behaviour reaches the escriba editor through. Behaviour reads a Snapshot and returns typed request slips; one interpreter applies them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
escriba-core   = { workspace = true }
# The seam knows the editor's types; the editor's types do not know the seam.
escriba-buffer = { workspace = true }
# Findings are a slip payload; shirube depends on core/buffer/memori only,
# so there is no cycle.
escriba-shirube = { workspace = true }
# `CaseMode` on `Freight::Scan`. escriba-search deps are serde/schemars/thiserror/
# memori/regex — it names no crate above this one, so the arrow stays acyclic.
escriba-search = { workspace = true }
# `HlClass` — the payload vocabulary of `Negai::PublishSemanticTokens`. The
# same reason `PickerSource` is declared here: a slip's payload types are
# madoguchi's vocabulary. hikari-core is a ZERO-DEPENDENCY crate, so this
# widens the seam's closure by one leaf and nothing else, and it is the class
# `escriba_ui::syntax::ChromeSyntax` is already total over — so a token type
# lowered onto it is themed on every face without a second colour table.
hikari-core    = { workspace = true }

[lints]
workspace = true
