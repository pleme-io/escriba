[workspace]
resolver = "2"
members = [
    "escriba-memori",
    "escriba-core",
    "escriba-madoguchi",
    "escriba-shirube",
    "escriba-buffer",
    "escriba-config",
    "escriba-mode",
    "escriba-search",
    "escriba-keymap",
    "escriba-command",
    "escriba-api",
    "escriba-spec",
    "escriba-ui",
    "escriba-render",
    "escriba-plugin",
    "escriba-vm",
    "escriba-input",
    "escriba-runtime",
    "escriba-ts",
    "escriba-lsp-client",
    "escriba-mcp",
    "escriba-tui",
    "escriba-lisp",
    "escriba",
]

[workspace.package]
version = "0.1.40"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/escriba"
authors = ["pleme-io"]

[workspace.dependencies]
# Workspace-internal — path deps.
escriba-core    = { path = "escriba-core", version = "0.1.40" }
escriba-madoguchi = { path = "escriba-madoguchi", version = "0.1.40" }
escriba-shirube = { path = "escriba-shirube", version = "0.1.40" }
escriba-buffer  = { path = "escriba-buffer", version = "0.1.40" }
escriba-config  = { path = "escriba-config", version = "0.1.40" }
escriba-mode    = { path = "escriba-mode", version = "0.1.40" }
escriba-memori  = { path = "escriba-memori", version = "0.1.40" }
escriba-search  = { path = "escriba-search", version = "0.1.40" }
escriba-keymap  = { path = "escriba-keymap", version = "0.1.40" }
escriba-command = { path = "escriba-command", version = "0.1.40" }
escriba-api     = { path = "escriba-api", version = "0.1.40" }
escriba-spec    = { path = "escriba-spec", version = "0.1.40" }
escriba-ui      = { path = "escriba-ui", version = "0.1.40" }
escriba-render  = { path = "escriba-render", version = "0.1.40" }
escriba-plugin  = { path = "escriba-plugin", version = "0.1.40" }
escriba-vm      = { path = "escriba-vm", version = "0.1.40" }
escriba-input   = { path = "escriba-input", version = "0.1.1" }
escriba-runtime = { path = "escriba-runtime", version = "0.1.1" }
escriba-ts      = { path = "escriba-ts", version = "0.1.1" }
escriba-lsp-client = { path = "escriba-lsp-client", version = "0.1.1" }
# hikari (光) — the fleet syntax-highlighting spine (crates.io, zero-dep).
# escriba-render consumes hikari-core (spine + incremental LineCache);
# escriba-ts re-exports hikari-token::Semantic (the deduped fleet vocabulary).
# See theory/HIKARI.md + theory/ESCRIBA.md.
hikari-core     = "0.1"
hikari-token    = { version = "0.1", features = ["schema"] }
# hikari-ts — the self-contained tree-sitter host; escriba-ts re-exports it and
# escriba-render registers its grammars into the highlight Ecosystem. Caret so a
# hikari-ts bump (new grammars) widens the editor's real-highlighting set free.
hikari-ts       = "0.1"
escriba-mcp     = { path = "escriba-mcp", version = "0.1.1" }
escriba-tui     = { path = "escriba-tui", version = "0.1.1" }
escriba-lisp    = { path = "escriba-lisp", version = "0.1.40" }

# Third-party.
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
serde_yaml       = "0.9"
thiserror        = "2"
anyhow           = "1"
blake3           = "1"
clap             = { version = "4", features = ["derive", "env"] }
ropey            = "1"
regex            = "1"
schemars         = { version = "0.8", features = ["chrono"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs"] }
tower-lsp        = "0.20"
async-trait      = "0.1"

# pleme-io sibling deps — git so CI works without checking out
# every sibling. Local development overrides via
# .cargo/config.toml [patch.<git-url>] sections.
#
# Each carries BOTH `git` (build source) and `version` (publish source):
# `cargo publish` strips the git spec and records the version req, so
# crates.io resolves the sibling from its published release. The version
# req matches the git-pinned build version AND an available crates.io
# release; without it crates.io rejects the publish ("all dependencies
# must have a version requirement"). This is the ★★ AUTO-RELEASE
# publish contract.
#
# tatara-lisp is the EXCEPTION, and deliberately so: the single canonical
# lineage (pleme-io/tatara-lisp) publishes every workspace member to
# crates.io, so it resolves straight from the registry — one source for
# both build and publish, no git spec to strip. It is the WASM/WASI-capable
# platform with the host-embeddable evaluator (tatara-lisp-eval) +
# compiler_spec polyglot seam. See
# docs/programmability-and-caixa-design.md §"lineage unification".
#
# `tatara-lisp-derive` is deliberately ABSENT: the lib re-exports the
# macros RENAMED — `DeriveTataraDomain` / `DeriveKeywordSexp`, so they
# coexist with the same-named traits — so naming the derive crate here
# would be a phantom dependency. Derive via `tatara_lisp::Derive*`.
tatara-lisp        = "0.3.3"
tatara-lisp-eval   = "0.3.3"
garasu             = "0.1"
madori             = "0.1"
ishou-tokens       = { version = "0.1", features = ["wgpu"] }
awase              = "0.1"
hayai              = "0.1"
irodori            = "0.1"
mojiban            = "0.1"
shikumi            = "0.1"
# The fleet Mealy-machine-with-effects primitive — escriba-runtime's
# operator-pending FSM stands on it (3rd consumer after bolso + gaveta).
zenmai             = "0.0"

# Testing.
pretty_assertions = "1"
tempfile          = "3"
proptest          = "1"
# PTY persona harness (escriba/tests/persona_pty.rs) — same pin set as
# the frost L0 harness so the espelho conformance rows stay one shape.
nix               = { version = "0.29", features = ["signal", "process", "fs", "term"] }
libc              = "0.2"

[workspace.lints.clippy]
pedantic              = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc    = "allow"
missing_panics_doc    = "allow"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"
strip         = true
