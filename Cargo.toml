[workspace]
resolver = "2"
members = [
    "escriba-core",
    "escriba-buffer",
    "escriba-config",
    "escriba-mode",
    "escriba-keymap",
    "escriba-command",
    "escriba-api",
    "escriba-spec",
    "escriba-ui",
    "escriba-render",
    "escriba-plugin",
    "escriba-vm",
    "escriba-input",
    "escriba-runtime",
    "escriba-ts",
    "escriba-lsp-client",
    "escriba-mcp",
    "escriba-tui",
    "escriba-lisp",
    "escriba",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/escriba"
authors = ["pleme-io"]

[workspace.dependencies]
# Workspace-internal — path deps.
escriba-core    = { path = "escriba-core", version = "0.1.1" }
escriba-buffer  = { path = "escriba-buffer", version = "0.1.1" }
escriba-config  = { path = "escriba-config", version = "0.1.1" }
escriba-mode    = { path = "escriba-mode", version = "0.1.1" }
escriba-keymap  = { path = "escriba-keymap", version = "0.1.1" }
escriba-command = { path = "escriba-command", version = "0.1.1" }
escriba-api     = { path = "escriba-api", version = "0.1.1" }
escriba-spec    = { path = "escriba-spec", version = "0.1.1" }
escriba-ui      = { path = "escriba-ui", version = "0.1.1" }
escriba-render  = { path = "escriba-render", version = "0.1.1" }
escriba-plugin  = { path = "escriba-plugin", version = "0.1.1" }
escriba-vm      = { path = "escriba-vm", version = "0.1.1" }
escriba-input   = { path = "escriba-input", version = "0.1.1" }
escriba-runtime = { path = "escriba-runtime", version = "0.1.1" }
escriba-ts      = { path = "escriba-ts", version = "0.1.1" }
escriba-lsp-client = { path = "escriba-lsp-client", version = "0.1.1" }
escriba-mcp     = { path = "escriba-mcp", version = "0.1.1" }
escriba-tui     = { path = "escriba-tui", version = "0.1.1" }
escriba-lisp    = { path = "escriba-lisp", version = "0.1.1" }

# Third-party.
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
serde_yaml       = "0.9"
thiserror        = "2"
anyhow           = "1"
blake3           = "1"
clap             = { version = "4", features = ["derive", "env"] }
ropey            = "1"
schemars         = { version = "0.8", features = ["chrono"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs"] }
tower-lsp        = "0.20"
async-trait      = "0.1"

# pleme-io sibling deps — git so CI works without checking out
# every sibling. Local development overrides via
# .cargo/config.toml [patch.<git-url>] sections.
tatara-lisp        = { git = "https://github.com/pleme-io/tatara", branch = "main" }
tatara-lisp-derive = { git = "https://github.com/pleme-io/tatara", branch = "main" }
garasu             = { git = "https://github.com/pleme-io/garasu", branch = "main" }
madori             = { git = "https://github.com/pleme-io/madori", branch = "main" }
ishou-tokens       = { git = "https://github.com/pleme-io/ishou", branch = "main", features = ["wgpu"] }
awase              = { git = "https://github.com/pleme-io/awase", branch = "main" }
hayai              = { git = "https://github.com/pleme-io/hayai", branch = "main" }
irodori            = { git = "https://github.com/pleme-io/irodori", branch = "main" }
mojiban            = { git = "https://github.com/pleme-io/mojiban", branch = "main" }
shikumi            = { git = "https://github.com/pleme-io/shikumi", branch = "main" }

# Testing.
pretty_assertions = "1"
tempfile          = "3"
proptest          = "1"
# PTY persona harness (escriba/tests/persona_pty.rs) — same pin set as
# the frost L0 harness so the espelho conformance rows stay one shape.
nix               = { version = "0.29", features = ["signal", "process", "fs", "term"] }
libc              = "0.2"

[workspace.lints.clippy]
pedantic              = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc    = "allow"
missing_panics_doc    = "allow"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"
strip         = true
