[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/escriba"
authors = ["pleme-io"]

[workspace.dependencies]
tatara-lisp = { path = "../tatara/tatara-lisp" }
tatara-lisp-derive = { path = "../tatara/tatara-lisp-derive" }
shikumi = { path = "../shikumi" }
garasu = { path = "../garasu" }
madori = { path = "../madori" }
awase = { path = "../awase" }
hayai = { path = "../hayai" }
irodori = { path = "../irodori" }
mojiban = { path = "../mojiban" }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
