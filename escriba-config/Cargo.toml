[package]
name = "escriba-config"
description = "Tatara-lisp editor config — defescriba / defkeymap / defcommand / defplugin / defmajor-mode / defminor-mode as TataraDomain types. Emacs-parity extensibility."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
escriba-core       = { workspace = true }
tatara-lisp        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
schemars           = { workspace = true }
thiserror          = { workspace = true }
# M-166 backfill — fleet-wide TieredConfig prime directive
# (shikumi@27d1a12). EscribaConfig is the only typed config in
# this crate; the impl + contract tests live in src/lib.rs.
shikumi            = { workspace = true }

# The theming framework. escriba's default theme is DERIVED from
# `FleetTheme::prescribed_default()`, never spelled as a literal — a literal
# is how `config-show default` came to report `vellum` while the editor
# booted `nord`.
ishou-tokens = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
