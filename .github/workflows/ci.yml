name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        # GPU/render crates depend on system libraries (wgpu, wayland)
        # absent on the runner; --lib + --tests over the non-render
        # subset is what we can reliably exercise in CI today.
        run: cargo test --workspace --exclude escriba-render --exclude escriba-tui
        continue-on-error: true
  nix-build:
    name: nix-build (informational)
    runs-on: macos-15
    # Permitted to fail until crate2nix's garasu-name-collision is
    # resolved upstream. Cargo CI is the canonical correctness gate.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Flake check
        run: nix flake check
      - name: Nix build
        run: nix build '.#default'
