[package]
name = "escriba-mode"
description = "Modal state machine for escriba — Normal/Insert/Visual/VisualLine/Command + pending-operator + pending-count state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
escriba-core   = { workspace = true }
escriba-memori = { workspace = true }
# The fleet Mealy-machine-with-effects primitive. Arrived with
# `operator_pending` when that module moved down from escriba-runtime — the
# FSM only ever needed escriba-core + zenmai, and sitting in the runtime made
# it unreachable for every consumer that wants vim key composition without an
# editor. Dependency-free and std-only, so this costs escriba-mode nothing.
zenmai       = { workspace = true }
serde        = { workspace = true }
schemars     = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json        = { workspace = true }

[lints]
workspace = true
