[package]
name = "escriba"
description = "The escriba editor binary. Composes every escriba-* crate via madori's app loop + garasu's GPU stack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "escriba"
path = "src/main.rs"

# GPU-default sibling binary. Same code, same CLI; only difference
# is `$ESCRIBA_RENDER=gpu` is pre-set. Users who want the GPU window
# by default wire `escriba-gpu`; nvim-style terminal users stay on
# plain `escriba`.
[[bin]]
name = "escriba-gpu"
path = "src/bin/escriba-gpu.rs"

[dependencies]
escriba-core    = { workspace = true }
# Shikumi — the `cli` feature ships ConfigShowCommand, the canonical
# clap factory every TieredConfig consumer wires in (Pillar 12: one
# Subcommand variant replaces every hand-rolled config-show surface).
shikumi         = { workspace = true, features = ["cli"] }
escriba-buffer  = { workspace = true }
escriba-config  = { workspace = true }
escriba-mode    = { workspace = true }
escriba-keymap  = { workspace = true }
escriba-command = { workspace = true }
escriba-ui      = { workspace = true }
escriba-render  = { workspace = true }
escriba-runtime = { workspace = true }
escriba-input   = { workspace = true }
escriba-tui     = { workspace = true }
escriba-plugin  = { workspace = true }
escriba-vm      = { workspace = true }
escriba-spec    = { workspace = true }
escriba-lisp    = { workspace = true }
escriba-ts      = { workspace = true }
madori          = { workspace = true }
garasu          = { workspace = true }
clap            = { workspace = true }
anyhow          = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# ─── persona_pty integration test (espelho guest conformance) ──────────
# Drives the REAL escriba TUI binary on a real PTY: nix owns the forkpty
# + termios reads, libc the TIOCSWINSZ resize injection, tempfile the
# hermetic $HOME. Mirrors frost/crates/frost/tests/persona_pty.rs.
nix      = { workspace = true }
libc     = { workspace = true }
tempfile = { workspace = true }
# ─── plugin_matrix verification (CLOSED-LOOP MASS-SYNTHESIS) ────────────
escriba-lisp   = { workspace = true }
escriba-plugin = { workspace = true }
tatara-lisp    = { workspace = true }

[lints]
workspace = true
