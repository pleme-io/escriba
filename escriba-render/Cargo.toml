[package]
name = "escriba-render"
description = "GPU renderer for escriba — garasu-backed text drawing, cursor/selection/highlight painting, Vellum (ishou) fleet-themed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
escriba-core    = { workspace = true }
escriba-buffer  = { workspace = true }
escriba-ui      = { workspace = true }
escriba-mode    = { workspace = true }
escriba-runtime = { workspace = true }
# Severity — the gutter paints a finding's mark, so this face needs to NAME
# one. The composition itself lives in `escriba_ui::gutter`, shared with the
# ratatui face; only the colour lookup is this crate's.
escriba-shirube = { workspace = true }
# Vellum fleet theme — GPU + text chrome read BORN ishou tokens; the
# `wgpu` feature gives `From<LinearRgba> for wgpu_types::Color` for the
# clear color (workspace dep already enables it).
ishou-tokens    = { workspace = true }
madori          = { workspace = true }
garasu          = { workspace = true }
# hikari (光) — path→highlighter→coverage-complete HlClass spans; NordTheme
# maps HlClass→Rgb. hikari-ts registers real tree-sitter grammars into the
# Ecosystem (rust); the zero-dep table backend fills every other language.
# The highlight ecosystem + escriba-local language tables live here now.
escriba-ts      = { workspace = true }
hikari-core     = { workspace = true }
hikari-ts       = { workspace = true }
glyphon         = "0.9"
wgpu            = "25"
tracing         = { workspace = true }
serde           = { workspace = true }

[dev-dependencies]
# Key — the text-face tests drive the editor with real keystrokes rather than
# poking `EditorState` fields, so they exercise the path the operator does.
escriba-keymap  = { workspace = true }

[lints]
workspace = true
