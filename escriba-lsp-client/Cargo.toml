[package]
name         = "escriba-lsp-client"
description  = "LSP client for escriba — spawns child LSP servers via stdio, forwards didOpen/didChange, collects diagnostics."
version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true
authors      .workspace = true

[dependencies]
escriba-core   = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
# `time` for the test timeouts only. Every test in conn.rs wraps its await in
# a timeout so a regression that reintroduces a hang FAILS instead of hanging
# the suite — which is the whole property under test. Scoped to dev so the
# workspace feature set is untouched.
tokio             = { workspace = true, features = ["time"] }
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }

[lints]
workspace = true
