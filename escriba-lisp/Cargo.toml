[package]
name = "escriba-lisp"
description = "Tatara-Lisp authoring bridge for escriba — declarative keybindings, options, themes, hooks, commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Rich chords (`<C-S-p>`, `<D-p>`) carry the fleet type.
awase = { workspace = true }
escriba-core    = { workspace = true }
escriba-keymap  = { workspace = true }
escriba-command = { workspace = true }
# `(defsplash …)` lowers into `escriba_ui::splash::Splash` HERE, in the spec
# crate, so all three faces (tui / gpu / text) consume one laid-out model —
# the same reason ishou-tokens is resolved here rather than per renderer.
escriba-ui      = { workspace = true }
tatara-lisp     = { workspace = true }
# `(deftheme :preset …)` resolves to a typed `ishou_tokens::FleetTheme` HERE,
# in the spec crate, so BOTH faces (escriba-tui and escriba-render) consume
# one mapping instead of each guessing its own. That shared resolution is
# what makes deftheme a system rather than decorative config.
ishou-tokens    = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
schemars        = { workspace = true }
blake3          = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
