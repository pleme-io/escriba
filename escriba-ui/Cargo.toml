[package]
name = "escriba-ui"
description = "Layout / Window / Viewport / TabBar / StatusLine / MiniBuffer for escriba — pure state, delegating rendering to escriba-render."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
escriba-core   = { workspace = true }
escriba-buffer = { workspace = true }
escriba-mode   = { workspace = true }
serde          = { workspace = true }
schemars       = { workspace = true }
# `chrome::ChromePalette` — the one seam turning a FleetTheme into the colors
# both renderers paint with. Pure data (theme -> resolved roles), so it stays
# inside this crate's "pure state" charter; nothing here renders.
ishou-tokens   = { workspace = true }
# Severity -> colour is a CHROME decision; shirube models what a finding is.
escriba-shirube = { workspace = true }
# hikari's `HlClass` + `Theme` — the syntax VOCABULARY, not a renderer. This
# crate answers "what colour is a keyword"; who draws it stays elsewhere.
hikari-core     = { workspace = true }
# The fleet's narrowing machine — a typed PickerEvent -> PickerEffect<T>
# state machine with its own scoring and zero rendering deps. Consumed, never
# reimplemented.
egaku           = "0.1"
escriba-keymap  = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
